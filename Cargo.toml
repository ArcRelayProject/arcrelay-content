[package]
name = "arcrelay-content"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
arcrelay-peer = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-peer.git", rev = "739e41c49020cf19f0d490c64143e68e995aef83" }
hmac = "0.12"
futures = { version = "0.3", default-features = false, features = ["executor"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
